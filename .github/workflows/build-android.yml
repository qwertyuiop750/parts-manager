name: Build Android APK

# 触发条件：推到 main/master 自动构建，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 接受 Android SDK 许可
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: 安装 Android SDK 组件
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 资源
        run: npm run build

      - name: 同步到 Android 项目
        run: npx cap sync android

      - name: 授予 gradlew 执行权限
        working-directory: android
        run: chmod +x gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: parts-manager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
