name: Build HBuilderX Project

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建项目
        run: npm run build

      - name: 上传 HBuilderX 项目
        uses: actions/upload-artifact@v4
        with:
          name: parts-manager-hbuilderx
          path: dist/
          retention-days: 30
          if-no-files-found: error
